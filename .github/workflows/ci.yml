# pull_request でも動かす。push だけにすると、PR の時点で落ちていることに気づけない。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 品質ゲート
        run: npm run check
      - name: テスト
        run: npm test
