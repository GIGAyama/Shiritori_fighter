# pull_request でも動かす。push だけにすると、PR の時点で落ちていることに気づけない。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 品質ゲート
        run: npm run check
      - name: テスト
        run: npm test

  # 正本（GIGAyama.github.io/standards/）との一致。コピーだけ直すと他リポジトリに修正が届かないため。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
