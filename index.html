<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="しりとりで対戦するバトルゲーム。声でも遊べる！ふたりでも、ひとりでも。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GIGA school">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="しりとりファイター">
<meta property="og:description" content="しりとりで対戦するバトルゲーム。声でも遊べる！ふたりでも、ひとりでも。">
<meta property="og:url" content="https://shiritori-fighter.giga-school.com/">
<meta property="og:image" content="https://giga-school.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#312e81">
<meta name="color-scheme" content="light">
<title>しりとりファイター</title>

<!--
  CSP（外部から差し込まれたコードを実行させないための設定）。
  'unsafe-inline' を足して済ませてはいけないので、本体の CSS と JavaScript は
  すべて外部ファイルに置いてある。インラインの <script> や onclick= を書き足すと
  その場で動かなくなる。足すときは必ず外部ファイルと addEventListener で。

  frame-ancestors は <meta> では無視される（読み込みのたびに警告が出るだけ）ため
  書いていない。他サイトへの埋め込みを止めるには HTTP ヘッダーが要るが、
  GitHub Pages では足せない。独自ドメインや CDN を挟むときに設定すること。
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self';
  font-src 'self';
  img-src 'self' data:;
  connect-src 'self';
  worker-src 'self';
  manifest-src 'self';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
">

<!-- ① インストールの合図をいちばん先に受け取る。
     Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
     本体スクリプトの読み込みより後だと合図を取りこぼし、
     通信が遅い端末で「インストール」ボタンが出なくなる。 -->
<script src="./install-hook.js"></script>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<!-- apple-touch-icon には透明を含まない専用画像を指す。
     iOS は透明部分を黒で埋めるため、流用するとホーム画面で四隅が黒くなる。 -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="しりとりファイター">

<!-- フォントは「見た目だけ」の依存。学校のフィルタリングで届かなくても
     端末側の日本語フォントに落ちるだけで、ゲームは動く（css/style.css を参照）。 -->
  <!-- 書体は自分のところから配る（生成物。node tools/fonts/build-fonts.mjs で作り直す）。
       ここに Google Fonts への link を戻さないこと。学校のフィルタが
       塞ぐと書体が当たらず、塞ぎ方によっては画面そのものが出ない。 -->
  <link rel="stylesheet" href="./fonts.css" />

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="bg-arena" aria-hidden="true"></div>
<canvas id="fx-canvas" aria-hidden="true"></canvas>

<div class="app">
    <header class="app-header">
        <div class="app-logo"><span class="bolt">⚡</span>しりとりファイター</div>
        <div class="header-actions">
            <button id="install-btn" class="tap-44" type="button" title="アプリとしてインストール">📲 インストール</button>
            <!-- 提示モード：電子黒板で一斉に見せるとき用。教室の後ろの席から読める大きさにする -->
            <button id="present-btn" class="icon-btn tap-44" type="button"
                    aria-label="大きく表示（提示モード）" aria-pressed="false" title="大きく表示">🔍</button>
            <button id="fullscreen-btn" class="icon-btn tap-44" type="button"
                    aria-label="全画面にする" title="全画面">⛶</button>
            <button id="sound-btn" class="icon-btn tap-44" type="button" aria-label="サウンド切り替え">🔊</button>
        </div>
    </header>

    <!-- ============ セットアップ画面 ============ -->
    <section id="setup-screen" class="screen active" aria-label="ゲーム設定">
        <div class="title-hero">
            <span class="hero-mark">⚔️</span>
            <h1>しりとりファイター</h1>
            <p>ことばで<ruby>戦<rt>たたか</rt></ruby>え！<ruby>声<rt>こえ</rt></ruby>でも<ruby>遊<rt>あそ</rt></ruby>べる しりとりバトル</p>
        </div>

        <div class="setup-card panel">
            <div class="setup-section-label">あそびかた</div>
            <div class="mode-tabs" role="radiogroup" aria-label="対戦モード">
                <button type="button" class="mode-tab selected" data-mode="pvp" role="radio" aria-checked="true">
                    <span class="mode-icon">🧑‍🤝‍🧑</span>ふたりで<ruby>対戦<rt>たいせん</rt></ruby>
                </button>
                <button type="button" class="mode-tab" data-mode="cpu" role="radio" aria-checked="false">
                    <span class="mode-icon">🤖</span>コンピュータと<ruby>対戦<rt>たいせん</rt></ruby>
                </button>
            </div>
        </div>

        <div class="players-setup">
            <div class="player-setup p1 panel">
                <h2>PLAYER 1</h2>
                <input type="text" id="p1-name" placeholder="なまえを入力してね" maxlength="10" autocomplete="off">
                <div class="character-selection" id="p1-chars" aria-label="プレイヤー1のキャラクター"></div>
            </div>
            <div class="player-setup p2 panel" id="p2-setup">
                <h2 id="p2-setup-title">PLAYER 2</h2>
                <input type="text" id="p2-name" placeholder="なまえを入力してね" maxlength="10" autocomplete="off">
                <div class="character-selection" id="p2-chars" aria-label="プレイヤー2のキャラクター"></div>
                <div id="cpu-level-wrap">
                    <div class="setup-section-label setup-section-label--sub">つよさ</div>
                    <div class="seg-group" id="cpu-level" role="radiogroup" aria-label="コンピュータの強さ">
                        <button type="button" class="seg-btn" data-level="easy">やさしい</button>
                        <button type="button" class="seg-btn selected" data-level="normal">ふつう</button>
                        <button type="button" class="seg-btn" data-level="hard">つよい</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="setup-card panel">
            <div class="game-settings">
                <div class="setting-item">
                    <label>たいりょく (HP)</label>
                    <div class="seg-group" id="hp-select" role="radiogroup" aria-label="初期HP">
                        <button type="button" class="seg-btn" data-hp="30">30</button>
                        <button type="button" class="seg-btn selected" data-hp="50">50</button>
                        <button type="button" class="seg-btn" data-hp="100">100</button>
                    </div>
                </div>
                <div class="setting-item">
                    <label>こたえる<ruby>時間<rt>じかん</rt></ruby> (<ruby>秒<rt>びょう</rt></ruby>)</label>
                    <div class="seg-group" id="time-select" role="radiogroup" aria-label="制限時間">
                        <button type="button" class="seg-btn" data-time="10">10</button>
                        <button type="button" class="seg-btn selected" data-time="20">20</button>
                        <button type="button" class="seg-btn" data-time="30">30</button>
                    </div>
                </div>
            </div>
        </div>

        <button id="start-game-btn" type="button">バトルスタート！</button>
    </section>

    <!-- ============ バトル画面 ============ -->
    <section id="game-screen" class="screen" aria-label="バトル">
        <div class="battle-hud">
            <div class="player-card p1 panel" id="player1-card">
                <span class="player-label">P1</span>
                <span class="turn-chip" aria-hidden="true">⚡</span>
                <div class="player-character" id="player1-char"></div>
                <div class="player-name" id="player1-name"></div>
                <div class="hp-row">
                    <div class="hp-bar-container"><div class="hp-bar" id="player1-hp"></div></div>
                    <span class="hp-num" id="player1-hp-num"></span>
                </div>
            </div>
            <div class="vs-block"><span class="vs">VS</span></div>
            <div class="player-card p2 panel" id="player2-card">
                <span class="player-label">P2</span>
                <span class="turn-chip" aria-hidden="true">⚡</span>
                <div class="player-character" id="player2-char"></div>
                <div class="player-name" id="player2-name"></div>
                <div class="hp-row">
                    <div class="hp-bar-container"><div class="hp-bar" id="player2-hp"></div></div>
                    <span class="hp-num" id="player2-hp-num"></span>
                </div>
            </div>
        </div>

        <div class="quest-zone">
            <div class="next-char-disc" id="next-char-disc" aria-live="polite">あ</div>
            <div class="quest-text">
                <div class="q-label">つぎの<ruby>文字<rt>もじ</rt></ruby>からスタート！</div>
                <div class="q-turn" id="turn-indicator"></div>
            </div>
        </div>

        <div class="timer-wrap panel" id="timer-wrap">
            <div class="timer-meta">
                <span>のこり<ruby>時間<rt>じかん</rt></ruby></span>
                <span class="timer-num" id="timer-num"></span>
            </div>
            <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
        </div>

        <div class="message-box panel" id="message-box" aria-live="polite"></div>
        <!-- 「ひらがなで入力してね」などの差し戻しは、読み上げでも割り込ませたいので
             aria-live="polite" ではなく role="alert" の入れ物を別に持つ -->
        <p id="alert-live" class="sr-only" role="alert"></p>

        <form class="input-area" id="wordForm">
            <input type="text" id="wordInput" placeholder="ことばを入力…" autocomplete="off"
                   autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"
                   aria-label="ことばを入力">
            <button type="button" id="mic-btn" aria-label="声で入力" title="声で入力">🎤</button>
            <button type="submit" id="submitBtn">こうげき！</button>
        </form>

        <div class="history-area panel" id="history-area" aria-label="使ったことば" aria-live="polite"></div>
    </section>

    <!-- ターン開始バナー -->
    <div id="turn-banner" aria-hidden="true"><div class="banner-inner" id="turn-banner-text"></div></div>

    <!-- ============ リザルト画面 ============ -->
    <div id="result-screen" role="dialog" aria-modal="true" aria-label="バトル結果">
        <div class="result-card panel">
            <div class="result-word" id="result-word">WIN!</div>
            <div class="winner-char" id="winner-char">🏆</div>
            <div class="winner-name" id="winner-name"></div>
            <div class="result-sub" id="result-sub"></div>
            <div class="result-stats">
                <div class="stat-tile"><div class="stat-num" id="stat-words">0</div><div class="stat-label">つかったことば</div></div>
                <div class="stat-tile"><div class="stat-num" id="stat-maxdmg">-</div><div class="stat-label">さいだいダメージ</div></div>
                <div class="stat-tile"><div class="stat-num" id="stat-time">0:00</div><div class="stat-label">バトル<ruby>時間<rt>じかん</rt></ruby></div></div>
            </div>
            <div class="result-actions">
                <button id="rematch-btn" type="button">もういちど！</button>
                <button id="home-btn" type="button">せっていにもどる</button>
            </div>
        </div>
    </div>
</div>


<script src="./js/kana.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
